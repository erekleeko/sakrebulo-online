<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>თერჯოლის საკრებულო - კენჭისყრა</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. საწყისი ეკრანი -->
    <div id="screen-home" class="panel active">
        <h1>სისტემაში შესვლა</h1>
        <div class="role-buttons">
            <button class="btn btn-admin" onclick="showLogin('admin')">საკრებულოს აპარატი</button>
            <button class="btn btn-deputy" onclick="showLogin('deputy')">საკრებულოს წევრი</button>
        </div>
    </div>

    <!-- 2. ავტორიზაციის (PIN / პაროლი) ეკრანი -->
    <div id="screen-login" class="panel">
        <h2 id="loginTitle">ავტორიზაცია</h2>
        <input type="password" id="passwordInput" placeholder="შეიყვანეთ კოდი..." onkeypress="handleEnter(event)">
        <div class="login-actions">
            <button class="btn btn-add" onclick="login()">შესვლა</button>
            <button class="btn btn-back" onclick="showHome()">უკან</button>
        </div>
    </div>

    <!-- 3. აპარატის (ადმინის) პანელი -->
    <div id="screen-admin" class="panel">
        <div class="admin-header">
            <h2>აპარატის პანელი</h2>
            <button class="btn btn-back" onclick="logout()">გამოსვლა</button>
        </div>
        
        <!-- სინქრონიზაციის ღილაკი -->
        <div class="form-group" style="justify-content: center;">
            <button class="btn btn-add" onclick="syncFromDrive()" id="syncBtn" style="width: 100%; max-width: 400px; font-size: 18px;">
                🔄 დრაივიდან სინქრონიზაცია
            </button>
        </div>
        
        <div id="issuesList"></div>
    </div>

    <!-- 4. დეპუტატის (კენჭისყრის) პანელი -->
    <div id="screen-deputy" class="panel">
        <div class="deputy-header">
            <span id="deputyName">დეპუტატი</span>
            <button class="btn btn-back" style="padding: 5px 15px; font-size: 14px;" onclick="logout()">გამოსვლა</button>
        </div>
        
        <div id="waiting">⏳ დაელოდეთ, მიმდინარეობს სხდომა...</div>

        <div id="votingSection">
            <div class="header">
                <h2 id="voteIssueTitle" style="margin:0;">სათაური</h2>
            </div>
            <div class="document-container">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
            <div class="actions" id="actionButtons">
                <button class="btn btn-yes" onclick="vote('yes')" id="btnYes">მომხრე</button>
                <button class="btn btn-no" onclick="vote('no')" id="btnNo">წინააღმდეგი</button>
                <button class="btn btn-abs" onclick="vote('abstain')" id="btnAbs">თავი შეიკავა</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
